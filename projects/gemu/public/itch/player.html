<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>playing - gemu</title>
<style>
  /* the platform's face, never the browser's */
  button{appearance:none;-webkit-appearance:none}

  html,body{height:100%;margin:0;background:#0b0d14;color:#e6ecff;font:300 14px Inter,system-ui,sans-serif}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid #1d2233;
       font:400 9px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.2em;text-transform:uppercase;color:#7f89a3}
  .bar a, .bar button{color:#7f89a3;background:none;border:0;text-decoration:none;font:inherit;letter-spacing:inherit;cursor:pointer}
  .bar a:hover, .bar button:hover{color:#e6ecff}
  main{height:calc(100vh - 37px)}
  iframe{width:100%;height:100%;border:0;display:block;background:#000}
  .flash{display:flex;align-items:center;justify-content:center;height:100%;background:#000}
</style>
<link rel="stylesheet" href="/ui/ui.css" />
</head>
<body>
  <div class="bar">
    <span id="title">loading</span>
    <span><button id="full">fullscreen</button> - <a href="/gemu/itch/">back</a></span>
  </div>
  <main id="frame"></main>
<script src="/gemu/itch/ruffle/ruffle.js"></script>
<script>
(function () {
  var game = window.__GAME__;
  var frame = document.getElementById("frame");
  document.getElementById("title").textContent = game.name;
  document.title = game.name + " - gemu";

  if (game.kind === "flash") {
    var host = document.createElement("div");
    host.className = "flash";
    host.id = "container";
    frame.appendChild(host);
    var player = window.RufflePlayer.newest();
    var ruffle = player.createPlayer();
    ruffle.style.width = "100%";
    ruffle.style.height = "100%";
    host.appendChild(ruffle);
    ruffle.load("/gemu/itch/game/" + encodeURIComponent(game.id) + "/" + encodeURIComponent(game.swfFile));
  } else {
    var view = document.createElement("iframe");
    view.src = "/gemu/itch/game/" + encodeURIComponent(game.id) + "/" + game.entry.split("/").map(encodeURIComponent).join("/");
    view.allow = "fullscreen; autoplay; gamepad; pointer-lock";
    frame.appendChild(view);
  }

  document.getElementById("full").onclick = function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else (frame.querySelector("iframe") || document.documentElement).requestFullscreen();
  };
})();
</script>
</body>
</html>
