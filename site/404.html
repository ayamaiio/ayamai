<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b0d14" />
<meta name="robots" content="noindex" />
<title>ayamai — not here</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
<style>
  :root{--bg:#0b0d14;--ink:#e6ecff;--pale:#b9c2da;--dim:#7f89a3;--line:#1d2233;--rei:#ff3b5c;--lilac:#a9b7e8}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:300 15px/1.6 Inter,ui-sans-serif,system-ui,sans-serif;text-align:left;padding:24px}
  .box{max-width:520px}
  .label{font:400 10px "IBM Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:var(--rei)}
  h1{margin:14px 0 10px;font:400 34px/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.06em}
  p{margin:0;color:var(--pale)}
  a{display:inline-block;margin-top:26px;padding:12px 18px;border:1px solid var(--line);border-radius:3px;
    color:var(--ink);text-decoration:none;font:400 10px "IBM Plex Mono",monospace;letter-spacing:.26em;text-transform:uppercase}
  a:hover{border-color:var(--rei)}
</style>
</head>
<body>
  <div class="box">
    <p class="label">404</p>
    <h1>there is nothing here</h1>
    <p>Whatever this address was, it is not part of the page.</p>
    <a href="/">back to ayamai</a>
  </div>
</body>
</html>
