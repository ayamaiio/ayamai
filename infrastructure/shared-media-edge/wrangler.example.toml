# Copy to a local, untracked config and fill in approved non-secret values.
# This is NOT a deployment or bucket migration script.
name = "shared-media-edge"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = false

[vars]
AUTH_API_ORIGIN = "https://replace-with-approved-api-origin.invalid"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "replace-with-existing-private-bucket"

# Add an approved custom-domain route only after reviewing host/content policy.
# Store EDGE_SERVICE_SECRET via Wrangler secrets, never in this file.
